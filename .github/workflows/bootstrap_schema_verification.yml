name: PanganLens bootstrap schema verification

on:
  workflow_dispatch:

concurrency:
  group: panganlens-bootstrap-schema-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-schema:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
    steps:
      - name: Validate required repository variables
        run: |
          set -eu
          missing=""
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required repository variables:$missing" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -c constraints/ci.txt -e .

      - name: Validate Google Cloud activation variables
        run: >-
          python -m panganlens.cloud_config_cli
          --project-id "$GCP_PROJECT_ID"
          --wif-provider "$GCP_WIF_PROVIDER"

      - id: auth
        name: Authenticate directly with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify bootstrap schema metadata
        run: |
          set -euo pipefail
          python -m panganlens.bootstrap_verifier_cli \
            --project-id "$GCP_PROJECT_ID" \
            | tee bootstrap-schema-verification.json

      - name: Build schema verification activation evidence
        if: always()
        run: >-
          python -m panganlens.cloud_run_evidence_cli
          schema_verification
          --result bootstrap-schema-verification.json
          --run-id "${{ github.run_id }}"
          --workflow-ref "${{ github.workflow_ref }}"
          --head-branch "${{ github.ref_name }}"
          --head-sha "${{ github.sha }}"
          --event "${{ github.event_name }}"
          > bootstrap-schema-verification-evidence.json

      - name: Upload schema verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panganlens-bootstrap-schema-verification-${{ github.sha }}
          path: |
            bootstrap-schema-verification.json
            bootstrap-schema-verification-evidence.json
          if-no-files-found: ignore
          retention-days: 7
