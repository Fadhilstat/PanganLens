name: PanganLens GCP auth smoke test

on:
  workflow_dispatch:

concurrency:
  group: panganlens-gcp-auth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate required repository variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -eu
          missing=""
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required repository variables:$missing" >&2
            exit 1
          fi

  auth-smoke:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      BIGQUERY_LOCATION: asia-southeast2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: auth
        name: Authenticate directly with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Verify Application Default Credentials with BigQuery
        run: |
          python - <<'PY'
          import os

          from google.cloud import bigquery

          project_id = os.environ["GCP_PROJECT_ID"]
          location = os.environ["BIGQUERY_LOCATION"]
          client = bigquery.Client(project=project_id, location=location)
          rows = list(client.query("SELECT 1 AS ok", location=location).result())
          if len(rows) != 1 or rows[0]["ok"] != 1:
              raise RuntimeError("BigQuery authentication smoke query returned an unexpected result")
          print("Direct keyless Google Cloud authentication and BigQuery access verified")
          PY
