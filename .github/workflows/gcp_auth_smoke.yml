name: PanganLens GCP auth smoke test

on:
  workflow_dispatch:

concurrency:
  group: panganlens-gcp-auth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
    steps:
      - name: Validate required repository variables
        run: |
          set -eu
          missing=""
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required repository variables:$missing" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -c constraints/ci.txt -e .

      - name: Validate Google Cloud activation variables
        run: >-
          python -m panganlens.cloud_config_cli
          --project-id "$GCP_PROJECT_ID"
          --wif-provider "$GCP_WIF_PROVIDER"

  auth-smoke:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: auth
        name: Authenticate directly with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -c constraints/ci.txt -e .

      - name: Verify Application Default Credentials with BigQuery
        run: |
          python - <<'PY'
          import os

          from google.cloud import bigquery

          from panganlens.schema_contract import WAREHOUSE_LOCATION

          project_id = os.environ["GCP_PROJECT_ID"]
          client = bigquery.Client(project=project_id, location=WAREHOUSE_LOCATION)
          rows = list(
              client.query("SELECT 1 AS ok", location=WAREHOUSE_LOCATION).result()
          )
          if len(rows) != 1 or rows[0]["ok"] != 1:
              raise RuntimeError("BigQuery authentication smoke query returned an unexpected result")
          print("Direct keyless Google Cloud authentication and BigQuery access verified")
          PY
