name: PanganLens website dashboard

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/dashboard_pages.yml"
  workflow_dispatch:
    inputs:
      refresh_from_bigquery:
        description: "Refresh website snapshot from curated BigQuery views before deployment"
        required: true
        type: boolean
        default: false

concurrency:
  group: panganlens-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      BIGQUERY_LOCATION: asia-southeast2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate BigQuery refresh context
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_from_bigquery }}
        run: |
          set -eu
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "BigQuery snapshot refresh is allowed only from main" >&2
            exit 1
          fi
          missing=""
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required repository variables:$missing" >&2
            exit 1
          fi

      - name: Authenticate directly with Workload Identity Federation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_from_bigquery }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_from_bigquery }}
        with:
          python-version: "3.11"

      - name: Export curated BigQuery snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_from_bigquery }}
        run: |
          python -m pip install -e .
          python scripts/export_dashboard_snapshot.py \
            --project-id "$GCP_PROJECT_ID" \
            --location "$BIGQUERY_LOCATION" \
            --output website/data/dashboard.json

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
