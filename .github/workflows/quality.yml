name: PanganLens quality

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: panganlens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -c constraints/ci.txt -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run Ruff
        run: ruff check src scripts tests
      - name: Compile Python
        run: python -m compileall -q src scripts tests


  frontend-quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check website/app.js
          node --check website/dashboard_metrics.js
          node --check website/price_playground.js
      - name: Test comparison math
        run: node --test tests/dashboard_metrics.test.cjs tests/price_playground.test.cjs

  browser-quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned browser test driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.61.1
      - name: Check desktop mobile and calculator in Chrome
        run: node --test tests/browser_portfolio.test.cjs
      - name: Retain responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panganlens-browser-qa
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  live-pihps-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -c constraints/ci.txt -e .
      - name: Probe PIHPS website interface
        run: >-
          python scripts/probe_pihps.py
          --output /tmp/pihps_probe_summary.json
      - name: Collect narrow unreviewed PIHPS research sample
        if: github.event_name != 'schedule'
        run: >-
          python scripts/export_pihps_research_sample.py
          --output-dir "$RUNNER_TEMP/pihps-research"
      - name: Retain unreviewed research sample for manual mapping review
        if: github.event_name != 'schedule' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pihps-unreviewed-research-sample
          path: ${{ runner.temp }}/pihps-research/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload schema-only probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pihps-probe-summary
          path: /tmp/pihps_probe_summary.json
          if-no-files-found: ignore
          retention-days: 7
