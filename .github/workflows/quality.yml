name: PanganLens quality

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run Ruff
        run: ruff check .
      - name: Compile Python
        run: python -m compileall -q src scripts tests

  live-pihps-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Probe PIHPS website interface
        run: >-
          python scripts/probe_pihps.py
          --output /tmp/pihps_probe_summary.json
      - name: Upload schema-only probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pihps-probe-summary
          path: /tmp/pihps_probe_summary.json
          if-no-files-found: ignore
          retention-days: 7
