name: PanganLens quality

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: panganlens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run Ruff
        run: ruff check src scripts tests
      - name: Compile Python
        run: python -m compileall -q src scripts tests

  live-pihps-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Probe PIHPS website interface
        run: >-
          python scripts/probe_pihps.py
          --output /tmp/pihps_probe_summary.json
      - name: Upload schema-only probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pihps-probe-summary
          path: /tmp/pihps_probe_summary.json
          if-no-files-found: ignore
          retention-days: 7
