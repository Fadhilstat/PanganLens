name: PanganLens bootstrap plan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panganlens-bootstrap-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -c constraints/ci.txt -e .
      - name: Build reviewed bootstrap plan
        run: >-
          python -m panganlens.bootstrap_executor_cli
          --repo-root .
          > /tmp/panganlens_bootstrap_plan.json
      - name: Upload bootstrap plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panganlens-bootstrap-plan-${{ github.sha }}
          path: /tmp/panganlens_bootstrap_plan.json
          if-no-files-found: error
          retention-days: 7
