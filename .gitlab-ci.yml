# PanganLens quality and static Pages delivery. No GCP authentication or ingestion.
default:
  image: python:3.11-slim-bookworm

stages:
  - verify
  - deploy
  - smoke

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

python_quality:
  stage: verify
  interruptible: true
  timeout: 15m
  script:
    - python -m pip install -c constraints/ci.txt -e ".[dev]"
    - pytest -q
    - ruff check src scripts tests
    - python -m compileall -q src scripts tests

frontend_quality:
  image: node:22-bookworm-slim
  stage: verify
  interruptible: true
  timeout: 5m
  script:
    - node --check website/app.js
    - node --check website/dashboard_metrics.js
    - node --check website/price_playground.js
    - node --test tests/dashboard_metrics.test.cjs tests/price_playground.test.cjs

deploy_portfolio_site:
  stage: deploy
  needs: ["python_quality", "frontend_quality"]
  script:
    - test -s website/index.html
    - test -s website/data/dashboard.json
    - python scripts/check_public_snapshot.py website/data/dashboard.json
  pages:
    publish: website
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


# Anonymous production check against Vercel, independent of the blocked GitLab
# Pages fallback. Visible on MR and main; a stale manual deployment is not CI green.
# Diagnostic until the owner connects the canonical GitHub repo for auto-deploy.
public_site_smoke:
  stage: smoke
  needs: ["python_quality", "frontend_quality"]
  allow_failure: true
  timeout: 3m
  script:
    - python scripts/check_public_site.py --url https://panganlens-portfolio.vercel.app/ --attempts 3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
